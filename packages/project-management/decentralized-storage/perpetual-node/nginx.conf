# Complete OpenResty Configuration with Security Facades
# File: packages/perpetual-node/config/nginx.conf

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    
    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging with security context
    log_format security '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent $request_time '
                       '"$http_user_agent" validation_result="$validation_result"';
    access_log /var/log/nginx/access.log security;
    
    # Rate limiting zones (tunable via environment)
    limit_req_zone $binary_remote_addr zone=api_rpm:10m rate=${API_RPM}r/m;
    lua_shared_dict pin_quota 10m;   # Per-IP daily quotas
    lua_shared_dict validation_cache 10m; # Cache validation results
    
    # Global request size limit (defense in depth)
    client_max_body_size 1m;
    
    server {
        listen 5001;
        server_name _;
        
        # Set validation result variable for logging
        set $validation_result "none";
        
        # CORS for extension origin only
        location ^~ /api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "${EXT_ID}";
                add_header Access-Control-Allow-Methods "POST, GET, OPTIONS";
                add_header Access-Control-Allow-Headers "content-type";
                add_header Access-Control-Max-Age 600;
                return 204;
            }
            add_header Access-Control-Allow-Origin "${EXT_ID}";
            
            # Security-hardened pin/add facade
            location = /api/v0/pin/add {
                limit_req zone=api_rpm burst=${PIN_ADD_BURST} nodelay;
                content_by_lua_file /usr/local/openresty/nginx/lua/pin_add_facade.lua;
            }
            
            # Size-limited, schema-validated dag/get facade  
            location = /api/v0/dag/get {
                limit_req zone=api_rpm burst=${DAG_GET_BURST} nodelay;
                content_by_lua_file /usr/local/openresty/nginx/lua/dag_get_facade.lua;
            }
            
            # Topic-allowlisted pubsub publish facade
            location = /api/v0/pubsub/pub {
                limit_req zone=api_rpm burst=${PUBSUB_PUB_BURST} nodelay;
                content_by_lua_file /usr/local/openresty/nginx/lua/pubsub_pub_facade.lua;
            }
            
            # Subscription-managed pubsub subscribe facade
            location = /api/v0/pubsub/sub {
                limit_req zone=api_rpm burst=${PUBSUB_SUB_BURST} nodelay;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                header_filter_by_lua_block {
                    ngx.header['Access-Control-Allow-Origin'] = os.getenv("EXT_ID")
                }
                access_by_lua_file /usr/local/openresty/nginx/lua/pubsub_sub_access.lua;
                proxy_pass http://127.0.0.1:5001$request_uri;
            }
            
            # Optional: schema-validated dag/put facade for authoring
            location = /api/v0/dag/put {
                limit_req zone=api_rpm burst=6 nodelay;
                content_by_lua_file /usr/local/openresty/nginx/lua/dag_put_facade.lua;
            }
            
            # Limited health check endpoint
            location = /api/v0/version {
                proxy_pass http://127.0.0.1:5001;
            }
            
            # Block dangerous endpoints
            location = /api/v0/add        { return 403; }
            location ^~ /api/v0/block/    { return 403; }
            location ^~ /api/v0/object/   { return 403; }
            location ^~ /api/v0/files/    { return 403; }
            location = /api/v0/dag/export { return 403; }
            location = /api/v0/dag/import { return 403; }
            
            # Default deny for any other API paths
            location ^~ /api/v0/          { return 404; }
        }
        
        # No gateway routes - completely disabled for security
        location ^~ /ipfs/  { return 404; }
        location ^~ /ipns/  { return 404; }
    }
}