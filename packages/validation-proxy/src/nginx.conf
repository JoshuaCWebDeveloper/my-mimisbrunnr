# OpenResty nginx configuration for IPFS API security facades
# Provides comprehensive security validation while maintaining Kubo API compatibility

worker_processes auto;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main;
    
    # Basic security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=pin_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=dag_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=pubsub_limit:10m rate=60r/m;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    
    # Upstream to Kubo IPFS node (internal)
    upstream kubo {
        server kubo:5001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Upstream to validation sidecar
    upstream validator {
        server validator:3000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }
    
    # Shared memory zones for rate limiting
    lua_shared_dict rate_store 10m;
    
    # Shared Lua variables
    init_by_lua_block {
        -- Rate limiting quotas (per day)
        PIN_QUOTA_DAILY = 100
        
        -- Size limits
        MAX_CONTENT_SIZE = 1048576  -- 1MB
        MAX_JSON_SIZE = 65536       -- 64KB for pubsub
        
        -- Validation timeouts
        VALIDATOR_TIMEOUT = 3000    -- 3 seconds
        KUBO_TIMEOUT = 10000        -- 10 seconds
        
        -- Load required modules
        cjson = require "cjson"
        http = require "resty.http"
        
        -- Initialize rate limiting store
        rate_store = {}
    }
    
    server {
        listen 5001;
        server_name _;
        
        # Connection limits
        limit_conn conn_limit_per_ip 10;
        
        # Security headers specific to IPFS API
        add_header Access-Control-Allow-Origin "chrome-extension://*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        
        # Handle preflight requests
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "chrome-extension://*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"ipfs-security-proxy"}';
            add_header Content-Type application/json;
        }
        
        # Pin/add facade - comprehensive security validation
        location = /api/v0/pin/add {
            limit_req zone=pin_limit burst=10 nodelay;
            
            content_by_lua_file /etc/nginx/lua/pin_add_facade.lua;
        }
        
        # DAG/get facade - size-limited content retrieval
        location = /api/v0/dag/get {
            limit_req zone=dag_limit burst=20 nodelay;
            
            content_by_lua_file /etc/nginx/lua/dag_get_facade.lua;
        }
        
        # Pubsub facades for OrbitDB compatibility
        location = /api/v0/pubsub/pub {
            limit_req zone=pubsub_limit burst=20 nodelay;
            
            content_by_lua_file /etc/nginx/lua/pubsub_pub_facade.lua;
        }
        
        location = /api/v0/pubsub/sub {
            limit_req zone=pubsub_limit burst=20 nodelay;
            
            content_by_lua_file /etc/nginx/lua/pubsub_sub_facade.lua;
        }
        
        # Block all other API endpoints for security
        location ~* ^/api/v0/(add|block|object|files|refs|repo|config|key|name|resolve|dht|bitswap|bootstrap|swarm|diag|log|stats|tar|get) {
            return 403 '{"Message":"API endpoint blocked for security"}';
            add_header Content-Type application/json;
        }
        
        # Allow specific safe endpoints (version, id)
        location ~* ^/api/v0/(version|id)$ {
            limit_req zone=api_limit burst=5 nodelay;
            
            proxy_pass http://kubo;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        
        # Block everything else
        location / {
            return 404 '{"Message":"Endpoint not found or blocked"}';
            add_header Content-Type application/json;
        }
    }
    
    # Internal validation server status endpoint
    server {
        listen 8080;
        server_name _;
        
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
        
        location /health-detailed {
            content_by_lua_file /etc/nginx/lua/health_detailed.lua;
        }
    }
}