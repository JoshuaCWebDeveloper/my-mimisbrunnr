services:
  # Kubo IPFS Node - Official container
  kubo:
    image: ipfs/kubo:v0.37.0 # Pin to specific version for security
    container_name: kubo
    restart: unless-stopped
    ports:
      - '9001:5001' # IPFS API port
      - '4001:4001' # P2P swarm port
      - '4001:4001/udp' # QUIC
      - '4002:4002' # WebSocket for browser connections
    environment:
      - IPFS_PROFILE=server
      - IPFS_PATH=/data/ipfs
    volumes:
      - ./docker/volumes/kubo_data:/data/ipfs
    # Use default IPFS startup for basic orchestration testing
    healthcheck:
      test: ['CMD', 'ipfs', 'version']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mimisbrunnr-network

  # OpenResty Security Proxy - Nginx + Lua facades
  validation-proxy:
    build:
      context: .
      dockerfile: packages/validation-proxy/Dockerfile
    container_name: validation-proxy
    restart: unless-stopped
    ports:
      - '5001:5001' # IPFS API proxy (replaces direct Kubo access)
      - '8080:8080' # Status and health endpoints
    depends_on:
      kubo:
        condition: service_healthy
      validation-service:
        condition: service_healthy
    networks:
      - mimisbrunnr-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - NGINX_WORKER_PROCESSES=auto
    # Add shared memory for rate limiting
    tmpfs:
      - /dev/shm:size=64m

  # AJV Validation Sidecar
  validation-service:
    build:
      context: .
      dockerfile: packages/validation-service/Dockerfile
    container_name: validation-service
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      - NODE_ENV=production
      - VALIDATOR_PORT=3000
      - LOG_LEVEL=info
    networks:
      - mimisbrunnr-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Security constraints
    read_only: true
    tmpfs:
      - /tmp:size=100m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # OrbitDB Manager Service
  orbitdb-service:
    build:
      context: .
      dockerfile: packages/orbitdb-service/Dockerfile
    container_name: orbitdb-service
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      - NODE_ENV=development
      - IPFS_API_URL=http://kubo:5001
      - ORBITDB_LOG_NAME=xcom-taglist-discovery
      - ORBITDB_DATA_DIR=/app/data/orbitdb
      - SERVICE_PORT=3001
      - SERVICE_LOG_CONFIG=logging.yaml
      - SERVICE_HEALTH_CHECK_INTERVAL=30000
    volumes:
      - ./docker/volumes/orbitdb_data:/app/packages/orbitdb-service/dist/orbitdb
    depends_on:
      kubo:
        condition: service_healthy
    networks:
      - mimisbrunnr-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    # Security constraints
    read_only: true
    tmpfs:
      - /tmp:size=100m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  mimisbrunnr-network:
    driver: bridge
    name: mimisbrunnr-network
