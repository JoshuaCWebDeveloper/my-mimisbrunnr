# OpenResty nginx configuration for IPFS API security facades
# Provides comprehensive security validation while maintaining Kubo API compatibility

worker_processes auto;
error_log /dev/stderr debug;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    resolver 127.0.0.11 ipv6=off; # Docker DNS resolver
    # TODO: We'll need to add the resolver for k8s here when we deploy this

    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    
    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /dev/stdout main;
    
    # Basic security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=pin_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=dag_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=pubsub_limit:10m rate=60r/m;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    
    # Upstream to Kubo IPFS node (internal)
    upstream kubo {
        server kubo:5001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Upstream to validation sidecar
    upstream validation-service {
        server validation-service:3000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }
    
    # Shared memory zones for rate limiting
    lua_shared_dict rate_store 10m;

    lua_package_path  "/usr/local/openresty/nginx/conf/lua/?.lua;/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/site/lualib/?/init.lua;
                   /usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;;";
    lua_package_cpath "/usr/local/openresty/site/lualib/?.so;/usr/local/openresty/lualib/?.so;;";
    
    # Shared Lua variables
    init_by_lua_block {
        -- Rate limiting quotas (per day)
        PIN_QUOTA_DAILY = 100
        
        -- Size limits
        MAX_CONTENT_SIZE = 1048576  -- 1MB
        MAX_JSON_SIZE = 65536       -- 64KB for pubsub
        
        -- Validation timeouts
        VALIDATOR_TIMEOUT = 3000    -- 3 seconds
        KUBO_TIMEOUT = 60000        -- 60 seconds
        
        -- Load required modules
        cjson = require "cjson"
        http = require "resty.http"
        
        -- Initialize rate limiting store
        rate_store = {}
    }
    
    server {
        listen 5001;
        server_name _;
        
        # Connection limits
        limit_conn conn_limit_per_ip 10;
        
        # Security headers specific to IPFS API
        add_header Access-Control-Allow-Origin "chrome-extension://*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;

        # Health check endpoint
        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"ipfs-security-proxy"}';
        }

        # Handle preflight requests for CORS
        location @options {
            add_header Access-Control-Allow-Origin "chrome-extension://*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }
        
        # Pin/add facade - comprehensive security validation
        location = /api/v0/pin/add {
            if ($request_method = OPTIONS) {
                return 204;
            }
            limit_req zone=pin_limit burst=10 nodelay;

            content_by_lua_file /usr/local/openresty/nginx/conf/lua/pin_add_facade.lua;
        }

        # DAG/get facade - CID validation with response size limits
        location = /api/v0/dag/get {
            if ($request_method = OPTIONS) {
                return 204;
            }
            limit_req zone=dag_limit burst=20 nodelay;

            # Limit response body size to prevent DoS (5MB max response)
            # Note: Content validation is done on write (dag/put), not on read
            proxy_max_temp_file_size 0;
            proxy_buffering off;
            client_max_body_size 5m;

            content_by_lua_file /usr/local/openresty/nginx/conf/lua/dag_get_facade.lua;
        }

        # DAG/put facade - validated content storage
        location = /api/v0/dag/put {
            if ($request_method = OPTIONS) {
                return 204;
            }
            limit_req zone=dag_limit burst=20 nodelay;

            # Set client body buffer size to prevent disk buffering
            client_body_buffer_size 2m;
            client_max_body_size 2m;

            content_by_lua_file /usr/local/openresty/nginx/conf/lua/dag_put_facade.lua;
        }

        # Pubsub facades for OrbitDB compatibility
        location = /api/v0/pubsub/pub {
            if ($request_method = OPTIONS) {
                return 204;
            }
            limit_req zone=pubsub_limit burst=20 nodelay;

            content_by_lua_file /usr/local/openresty/nginx/conf/lua/pubsub_pub_facade.lua;
        }

        location = /api/v0/pubsub/sub {
            if ($request_method = OPTIONS) {
                return 204;
            }
            limit_req zone=pubsub_limit burst=20 nodelay;

            content_by_lua_file /usr/local/openresty/nginx/conf/lua/pubsub_sub_facade.lua;
        }

        # Routing/put facade for IPNS record publishing
        location = /api/v0/routing/put {
            if ($request_method = OPTIONS) {
                return 204;
            }
            limit_req zone=api_limit burst=10 nodelay;

            client_body_buffer_size 16k;
            client_max_body_size 16k;

            content_by_lua_file /usr/local/openresty/nginx/conf/lua/routing_put_facade.lua;
        }
        
        # Allow specific safe endpoints (version, id, name/resolve)
        location ~* ^/api/v0/(version|id|name/resolve)$ {
            limit_req zone=api_limit burst=5 nodelay;
            
            proxy_pass http://kubo;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        
        # Block all other API endpoints for security
        location ~* ^/api/v0/(add|block|object|files|refs|repo|config|key|name|resolve|dht|bitswap|bootstrap|swarm|diag|log|stats|tar|get) {
            add_header Content-Type application/json always;
            return 403 '{"Message":"{\"ValidationError\":\"API endpoint blocked for security\"}"}';
        }
        
        # Block everything else
        location / {
            add_header Content-Type application/json always;
            return 404 '{"Message":"{\"ValidationError\":\"Endpoint not found or blocked\"}"}';
        }
    }
    
    # Internal validation server status endpoint
    server {
        listen 8080;
        server_name _;

        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"ipfs-security-proxy"}';
        }

        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        location /health-detailed {
            content_by_lua_file /usr/local/openresty/nginx/conf/lua/health_detailed.lua;
        }
    }
}